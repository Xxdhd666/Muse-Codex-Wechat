<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>额度悬浮球</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ball.css">
</head>
<body>
<div id="full">
  <div id="ball" class="ball">
    <svg viewBox="0 0 84 84" class="ring" aria-hidden="true">
      <circle class="ring-bg" cx="42" cy="42" r="39"></circle>
      <circle id="ring-main" class="ring-fg" cx="42" cy="42" r="39"></circle>
      <circle id="ring-aux-bg" class="ring-bg thin" cx="42" cy="42" r="33"></circle>
      <circle id="ring-aux" class="ring-fg thin" cx="42" cy="42" r="33"></circle>
    </svg>
    <span class="ball-in">
      <span id="ball-name" class="ball-name">Codex</span>
      <span id="ball-num" class="ball-num">--</span>
      <span id="ball-aux" class="ball-aux"></span>
    </span>
  </div>
</div>
<div id="strip" class="strip left" hidden>
  <span id="s-edge" class="edge"></span>
  <span id="s1" class="s1">--</span>
  <span id="s2" class="s2"></span>
</div>
<script src="ball.js"></script>
</body>
</html>
